  <!-- Request page styling -->
  <style>
    .request-shell {
      max-width: 820px;
      margin: 0 auto;
      padding: 52px 24px 80px;
    }

    .request-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: clamp(20px, 4vw, 36px);
      box-shadow: 0 12px 35px rgba(9, 51, 62, .07);
    }

    .request-card h1 {
      font-size: clamp(2rem, 5vw, 3.3rem);
      color: var(--ink);
      line-height: 1.05;
      letter-spacing: -.05em;
      margin: 0 0 12px;
    }

    .request-card p {
      color: var(--muted);
    }

    .request-form {
      display: grid;
      gap: 16px;
      margin-top: 24px;
    }

    .request-form label {
      display: grid;
      gap: 7px;
      font-weight: 750;
    }

    .request-form input,
    .request-form textarea,
    .request-form select {
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      font: inherit;
      width: 100%;
    }

    .request-form input[readonly] {
      background: #f1f5f9;
      color: #475569;
      cursor: not-allowed;
    }

    .request-form textarea {
      min-height: 130px;
      resize: vertical;
    }

    .request-form .button {
      border: 0;
      background: var(--accent);
      color: #fff;
      font: inherit;
      cursor: pointer;
      justify-self: start;
      padding: 12px 18px;
      border-radius: 10px;
    }

    .request-form .button:hover {
      opacity: .9;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--accent-dark);
      font-weight: 800;
      text-decoration: none;
    }

    .notice {
      font-size: .88rem;
      background: #eef7f8;
      border-radius: 10px;
      padding: 12px 14px;
    }

    .request-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
